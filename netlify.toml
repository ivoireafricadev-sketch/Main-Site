# Netlify build + function configuration.
#
# The site is plain static HTML, so there is no build command - Netlify just
# publishes public/ as-is. The only server-side code is the event function in
# netlify/functions/, which runs after each verified form submission.
#
# Publish directory used to be set only in the Netlify UI. Declaring it here
# keeps it in version control; the UI setting is ignored once this file exists.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# --- ACCOUNT SUSPENSION GATE -------------------------------------------------
# While this block is present, every request is served the suspension page with
# an HTTP 403. This is a deliberate hold for a past-due account, not an outage.
# TO RESTORE THE SITE: delete this single [[redirects]] block and redeploy.
# (Leave the /mro rule below in place.)
[[redirects]]
  from = "/*"
  to = "/suspended.html"
  status = 403
  force = true
# --- END SUSPENSION GATE -----------------------------------------------------

[[redirects]]
  from = "/mro"
  to = "/mro-solutions.html"
  status = 301
